
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px}
.root{padding:20px}

.summary-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.sum-card{padding:12px 14px;border-radius:var(--border-radius-md);border:0.5px solid}
.sum-card.crit{background:var(--color-background-danger);border-color:var(--color-border-danger)}
.sum-card.maj{background:var(--color-background-warning);border-color:var(--color-border-warning)}
.sum-card.mod{background:var(--color-background-secondary);border-color:var(--color-border-secondary)}
.sum-card.min{background:var(--color-background-success);border-color:var(--color-border-success)}
.sum-num{font-size:28px;font-weight:500;line-height:1}
.sum-num.crit{color:var(--color-text-danger)}
.sum-num.maj{color:var(--color-text-warning)}
.sum-num.mod{color:var(--color-text-secondary)}
.sum-num.min{color:var(--color-text-success)}
.sum-label{font-size:11px;color:var(--color-text-secondary);margin-top:4px}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:5px 12px;border-radius:100px;border:0.5px solid var(--color-border-secondary);background:transparent;font-size:12px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;transition:all .12s;font-family:var(--font-sans)}
.filter-btn:hover{background:var(--color-background-secondary)}
.filter-btn.on{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
.filter-btn.crit.on{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.filter-btn.maj.on{background:var(--color-background-warning);border-color:var(--color-border-warning);color:var(--color-text-warning)}
.filter-btn.suc.on{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}

.flaw-list{display:flex;flex-direction:column;gap:10px}
.flaw-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer;transition:border-color .15s}
.flaw-card:hover{border-color:var(--color-border-secondary)}
.flaw-card.open{border-color:var(--color-border-secondary)}

.flaw-header{display:flex;align-items:center;gap:12px;padding:14px 16px}
.flaw-sev{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:100px;white-space:nowrap;flex-shrink:0}
.sev-critical{background:var(--color-background-danger);color:var(--color-text-danger);border:0.5px solid var(--color-border-danger)}
.sev-major{background:var(--color-background-warning);color:var(--color-text-warning);border:0.5px solid var(--color-border-warning)}
.sev-moderate{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary)}
.sev-minor{background:var(--color-background-success);color:var(--color-text-success);border:0.5px solid var(--color-border-success)}

.flaw-id{font-size:11px;font-family:var(--font-mono);color:var(--color-text-tertiary);flex-shrink:0}
.flaw-title{font-size:13px;font-weight:500;color:var(--color-text-primary);flex:1;min-width:0}
.flaw-category{font-size:11px;color:var(--color-text-tertiary);background:var(--color-background-secondary);padding:2px 8px;border-radius:var(--border-radius-md);white-space:nowrap;flex-shrink:0}
.flaw-chevron{color:var(--color-text-tertiary);font-size:12px;transition:transform .2s;flex-shrink:0}
.flaw-card.open .flaw-chevron{transform:rotate(180deg)}

.flaw-body{display:none;border-top:0.5px solid var(--color-border-tertiary)}
.flaw-card.open .flaw-body{display:block}

.flaw-section{padding:14px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.flaw-section:last-child{border-bottom:none}
.flaw-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-tertiary);margin-bottom:8px}

.code-block{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;font-family:var(--font-mono);font-size:12px;color:var(--color-text-secondary);line-height:1.6;border-left:3px solid var(--color-border-danger);margin-bottom:6px}
.code-block.fix{border-left-color:var(--color-border-success)}
.flaw-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:8px}
.book-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:var(--border-radius-md);background:var(--color-background-info);color:var(--color-text-info);margin:2px}

.fix-row{display:flex;gap:10px}
.fix-col{flex:1;min-width:0}
.fix-col-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-danger);margin-bottom:6px}
.fix-col-label.fix{color:var(--color-text-success)}

.count{font-size:11px;color:var(--color-text-tertiary);margin-left:auto;flex-shrink:0}
</style>

<div class="root">
  <div class="summary-row">
    <div class="sum-card crit">
      <div class="sum-num crit" id="cnt-crit">0</div>
      <div class="sum-label">Critical flaws</div>
    </div>
    <div class="sum-card maj">
      <div class="sum-num maj" id="cnt-maj">0</div>
      <div class="sum-label">Major flaws</div>
    </div>
    <div class="sum-card mod">
      <div class="sum-num mod" id="cnt-mod">0</div>
      <div class="sum-label">Moderate flaws</div>
    </div>
    <div class="sum-card min">
      <div class="sum-num min" id="cnt-min">0</div>
      <div class="sum-label">Minor flaws</div>
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn on" onclick="filter('all',this)">All flaws</button>
    <button class="filter-btn crit" onclick="filter('critical',this)">Critical</button>
    <button class="filter-btn maj" onclick="filter('major',this)">Major</button>
    <button class="filter-btn" onclick="filter('moderate',this)">Moderate</button>
    <button class="filter-btn suc" onclick="filter('minor',this)">Minor</button>
    <button class="filter-btn" onclick="filter('UX',this)">UX</button>
    <button class="filter-btn" onclick="filter('Performance',this)">Performance</button>
    <button class="filter-btn" onclick="filter('Accessibility',this)">Accessibility</button>
    <button class="filter-btn" onclick="filter('Compliance',this)">Compliance</button>
    <button class="filter-btn" onclick="filter('Layout',this)">Layout</button>
  </div>

  <div class="flaw-list" id="flaw-list"></div>
</div>

<script>
const FLAWS = [
  {
    id:'F-001', sev:'critical', cat:'Performance',
    title:'Parallel data fetching with 6 separate API calls — N+1 anti-pattern',
    desc:'`_refreshData()` fires 6 independent `ref.refresh()` calls in parallel: currentUser, userCompliance, enrollments, resumeLabels, assignments, certificates. This is a classic N+1 query problem. Each call is a separate round trip to Serverpod. On a mobile network (100-300ms RTT), this adds up to 600-1800ms of perceived latency before a single piece of data renders. Doherty Threshold requires response within 400ms.',
    books:['Doherty Threshold','Practical UI'],
    bad:'Future.wait([ref.refresh(currentUserProvider.future), ref.refresh(userComplianceProvider.future), ref.refresh(enrollmentsProvider.future), ref.refresh(enrollmentResumeLabelsProvider.future), ref.refresh(assignmentsProvider.future), ref.refresh(certificatesProvider.future),]);',
    fix:'Create a single consolidated endpoint GET /api/employee/dashboard that returns { user, compliance, enrollments, assignments, certificates } in one database transaction. This is already specified in the master prompt but not implemented.\n\nfinal dashboardProvider = AsyncNotifierProvider<DashboardNotifier, DashboardSummary>(DashboardNotifier.new);\n// Single call, no N+1'
  },
  {
    id:'F-002', sev:'critical', cat:'UX',
    title:'Hardcoded 0.35 progress — user sees wrong data always',
    desc:'`final progress = enrollment.status == "in_progress" ? 0.35 : 0.0;` — this hardcodes 35% for every in-progress course and 0% for not-started. Every user sees 35% regardless of actual completion. In a pharma GxP context this is a compliance data integrity failure — the progress shown must match the actual audit trail. A regulator checking a training record will see fabricated data.',
    books:['UI is Communication','ALCOA+','21 CFR Part 11'],
    bad:"final progress = enrollment.status == 'in_progress' ? 0.35 : 0.0; // WRONG — hardcoded fake value",
    fix:'Progress must come from actual lesson completion data:\nfinal progress = enrollment.completionPercent / 100.0;\n// completionPercent computed server-side from:\n// completed lessons / total lessons * 100\n// This is already in the Serverpod model — just wire it up'
  },
  {
    id:'F-003', sev:'critical', cat:'Compliance',
    title:'SOP retraining badge uses UPPERCASE ALL CAPS in violation of platform spec',
    desc:'`"SOP UPDATE"`, `"OVERDUE"`, `"UP NEXT"` are rendered in ALL CAPS as Text() strings. The master prompt and Apple HIG both specify sentence case everywhere. But more critically for a GxP platform: these labels are shown on compliance documents and training records. Inconsistent casing is a data quality issue flagged in ALCOA+ (Accurate, Legible, Contemporaneous). "SOP UPDATE" and "Sop Update" in different places = different strings in audit trail exports.',
    books:['Apple HIG','ALCOA+','UI is Communication'],
    bad:'"SOP UPDATE"\n"OVERDUE" \n"UP NEXT"\n// All caps rendered as content strings',
    fix:'Use sentence case in all user-facing strings:\n"Sop update"\n"Overdue"\n"Up next"\n\nFor the visual badge, use letterSpacing + small caps styling rather than uppercasing the content string itself.\nAlternatively: use the existing TrainingStatusDisplay extension which already returns human-readable labels.'
  },
  {
    id:'F-004', sev:'critical', cat:'UX',
    title:'TweenAnimationBuilder pulsing dot never completes — infinite freeze',
    desc:'`TweenAnimationBuilder<double>(tween: Tween(begin: 0.6, end: 1.0), duration: Duration(milliseconds: 800))` runs once from 0.6 to 1.0 and stops. It does NOT loop. The urgency dot becomes completely static after 800ms. Designing with the Mind in Mind: motion is feedback — a stopped urgency indicator suggests the urgent state has resolved. Users who see the dot stop moving may think the overdue state was cleared.',
    books:['Designing with Mind in Mind','Practical UI'],
    bad:'TweenAnimationBuilder<double>(\n  tween: Tween(begin: 0.6, end: 1.0),\n  duration: Duration(milliseconds: 800),\n  // No repeat — stops after one cycle',
    fix:'Replace with a RepeatAnimation or use flutter_animate:\n// Using flutter_animate:\nContainer().animate(onPlay: (c) => c.repeat(reverse:true))\n  .fade(begin:0.4, end:1.0, duration:800.ms)\n\n// Or use AnimationController with repeat:\n_controller = AnimationController(vsync: this)\n  ..repeat(reverse:true);'
  },
  {
    id:'F-005', sev:'major', cat:'UX',
    title:'Hero card gradient is wrong — uses N900/N800 instead of specified navy blue',
    desc:'The code uses `Color(0xFF0F172A)` (N900 near-black) → `Color(0xFF1E293B)` (N800 dark slate). The design spec explicitly states: "navy gradient: #0F172A → #1E293B". While the hex values match, these render as near-BLACK not navy blue. The Figma spec says "deep navy gradient (NOT solid purple)" — but the actual rendered gradient on a phone will look black, not navy. The course thumbnail completely disappears against this background.',
    books:['Refactoring UI','Apple HIG Depth'],
    bad:'gradient: LinearGradient(\n  colors: [\n    Color(0xFF0F172A), // Near-black, not navy\n    Color(0xFF1E293B), // Dark slate, no blue tone\n  ],',
    fix:'Use the specified blue-shifted navy:\ngradient: LinearGradient(\n  begin: Alignment.topLeft,\n  end: Alignment.bottomRight,\n  colors: [\n    Color(0xFF0A1628), // Deep navy — has visible blue\n    Color(0xFF1A3354), // Mid navy\n    Color(0xFF0D4A7A), // Bottom accent — clear blue\n  ],\n  stops: [0.0, 0.5, 1.0],\n)'
  },
  {
    id:'F-006', sev:'major', cat:'Layout',
    title:'Fixed SizedBox(height: 420) for tab content — breaks on all screen sizes',
    desc:'`SizedBox(height: 420)` wraps the TabBarView for course cards. On iPhone SE (667px screen height minus topbar/padding = ~520px visible), 420px for tabs alone leaves no room for the stats or hero card. On iPad, 420px is cramped and wastes 60% of available space. The master prompt and Practical UI both state: "scroll is free, never cram". This fixed height FORCES vertical clamping.',
    books:['Practical UI','Apple HIG Clarity'],
    bad:'SizedBox(\n  height: 420, // Fixed — breaks on all non-standard screens\n  child: TabBarView(...))',
    fix:'Replace with flexible expansion:\nExpanded(\n  child: TabBarView(\n    controller: tabController,\n    children: [...],\n  ),\n)\n// The outer SingleChildScrollView already handles scroll.\n// Remove the SizedBox entirely and let the grid expand naturally.\n// Use NeverScrollableScrollPhysics() on the GridView inside.'
  },
  {
    id:'F-007', sev:'major', cat:'UX',
    title:'Compliance banner navigates via tabController.animateTo(1) — wrong destination',
    desc:'The compliance urgency banner CTA calls `tabController.animateTo(1)` — this scrolls the Dashboard tab bar to "To Do" tab. But the OVERDUE items live in To Do. This is correct for the dashboard, but: (1) the button label says "View Overdue →" which implies going to a dedicated overdue screen, not switching a local tab. (2) The user doesn\'t know the tab index. (3) If the user is already on tab 0 (In Progress has overdue items), tab 1 might be wrong. Don\'t Make Me Think: the CTA should navigate to My Training filtered to Overdue.',
    books:["Don't Make Me Think",'Laws of UX Jakob'],
    bad:"onViewOverdue: () => tabController.animateTo(1),\n// Animates local tab — user expects full Overdue screen",
    fix:"onViewOverdue: () {\n  // Navigate to My Training with overdue filter pre-applied\n  context.go('/employee/training', extra: {'filter': 'overdue'});\n},\n// This matches user expectation from the CTA label\n// and the navigation architecture in the master prompt"
  },
  {
    id:'F-008', sev:'major', cat:'UX',
    title:'`_upNext` priority algorithm ignores time-criticality — always shows SOP first',
    desc:'The `_upNext` getter puts SOP retraining first regardless of how long it has been overdue, then overdue in-progress, then closest due date. But: an employee who has a regular course overdue by 45 days but an SOP retraining overdue by 1 day will see the SOP. The correct algorithm is: sort all overdue items by days-overdue descending, then sort not-yet-overdue by due date ascending. The current approach can hide a 45-day overdue item behind a 1-day SOP update.',
    books:['UI is Communication','Laws of UX Fitts'],
    bad:'// Priority 1: SOP retraining (any recency)\n// Priority 2: Overdue in-progress\n// Priority 3: Closest due date\n// WRONG: A 1-day SOP beats a 45-day overdue course',
    fix:'// Sort ALL overdue items by days overdue descending\nfinal allOverdue = _enrollments\n  .where(_isOverdue)\n  .toList()\n  ..sort((a, b) {\n    final daysA = DateTime.now().difference(_getDueDate(a)).inDays;\n    final daysB = DateTime.now().difference(_getDueDate(b)).inDays;\n    return daysB.compareTo(daysA); // Most overdue first\n  });\nif (allOverdue.isNotEmpty) return allOverdue.first;'
  },
  {
    id:'F-009', sev:'major', cat:'Accessibility',
    title:'No Semantics labels on any interactive widget — screen reader silent',
    desc:'The entire dashboard has zero Semantics() widgets. FilledButton.icon has no semanticsLabel override. The stat cards, hero card, compliance banner, and tab bar all lack ARIA-equivalent labels. The master prompt specifies WCAG AA mandatory: "All buttons: Semantics(label: ..., button: true). Course cards: Semantics(label: \'GMP Fundamentals, overdue, due Mar 11 2026\')". A screen reader user would hear nothing useful from this screen.',
    books:['WCAG AA','Apple HIG Accessibility'],
    bad:'FilledButton.icon(\n  onPressed: () {...},\n  icon: Icon(Icons.play_arrow_rounded),\n  label: Text("Resume Course"),\n  // No semanticsLabel — screen reader reads icon description',
    fix:'Semantics(\n  label: "Resume GMP Fundamentals course, overdue by 3 days",\n  button: true,\n  child: FilledButton.icon(\n    onPressed: () {...},\n    ...\n  ),\n)\n// Also wrap stat cards:\nSemantics(\n  label: "Overdue courses: 2, action required",\n  child: _StatCard(...),\n)'
  },
  {
    id:'F-010', sev:'major', cat:'UX',
    title:'Loading skeleton uses `SkeletonLoader` but `width` is wrong for `Expanded` children',
    desc:'`SkeletonLoader(height: 36, width: 240)` inside an `Expanded` child will render a 240px skeleton in what should be a full-width slot. The `Expanded` wants to fill the remaining space, but the fixed width: 240 inside it means the skeleton is misaligned with the actual content that will appear there. This creates a layout jump (CLS) when the real content loads. Also: `width` is passed as a named parameter, but the `SkeletonLoader` component API may not support it.',
    books:['Doherty Threshold','Practical UI'],
    bad:'Row(\n  children: [\n    Expanded(\n      child: Column(\n        children: [\n          SkeletonLoader(height: 36, width: 240), // Wrong! Expanded ignores fixed width',
    fix:'SkeletonLoader should use double.infinity for width inside Expanded:\nExpanded(\n  child: Column(\n    children: [\n      SkeletonLoader(height: 36), // No width — fills Expanded\n      SizedBox(height: AppSpacing.s2),\n      SkeletonLoader(height: 16), // No width — fills Expanded\n    ],\n  ),\n)'
  },
  {
    id:'F-011', sev:'moderate', cat:'UX',
    title:'Duplicate icon logic in hero CTA — both branches use `Icons.play_arrow_rounded`',
    desc:'`icon: Icon(enrollment.status == "in_progress" ? Icons.play_arrow_rounded : Icons.play_arrow_rounded)` — both branches of the ternary return the exact same icon. The "Resume" state should show a different icon from "Start Now" to communicate the distinction. Designing with the Mind in Mind: affordance requires icons that match the action\'s meaning.',
    books:['Designing with Mind in Mind','UI is Communication'],
    bad:"icon: Icon(\n  enrollment.status == 'in_progress'\n    ? Icons.play_arrow_rounded  // Same icon\n    : Icons.play_arrow_rounded, // Same icon — copy-paste error",
    fix:"icon: Icon(\n  enrollment.status == 'in_progress'\n    ? Icons.play_arrow_rounded      // Resume = play\n    : status == TrainingStatus.sopUpdate\n      ? Icons.edit_document          // SOP = review doc\n      : Icons.rocket_launch_outlined // Start = launch\n)"
  },
  {
    id:'F-012', sev:'moderate', cat:'Layout',
    title:'Stat card value uses `AppTypography.display.copyWith(fontSize: 32)` — defeats token system',
    desc:'`AppTypography.display.copyWith(color: color, fontSize: 32)` — this starts from the display style then overrides fontSize to 32. But `AppTypography.display` is already defined (presumably at 44px or similar). This is an inline style override that defeats the token system. If AppTypography.display is ever updated, this override will produce inconsistent results. The design token system says: "no hardcoded hex values anywhere" — same applies to hardcoded font sizes.',
    books:['Atomic Design','Refactoring UI'],
    bad:'Text(\n  value,\n  style: AppTypography.display.copyWith(\n    color: color,\n    fontSize: 32, // Hardcoded — not a token\n    fontWeight: FontWeight.w700,\n  ),',
    fix:'Add a statValue style to AppTypography tokens:\n// In tokens.dart:\nstatic const statValue = TextStyle(\n  fontFamily: AppFonts.display,\n  fontSize: 32,  // or AppFontSizes.statValue\n  fontWeight: FontWeight.w700,\n  letterSpacing: -0.04 * 32,\n);\n// In widget:\nstyle: AppTypography.statValue.copyWith(color: color)'
  },
  {
    id:'F-013', sev:'moderate', cat:'UX',
    title:'`lastUpdated?.humanDate` shown instead of time-aware greeting',
    desc:'`lastUpdated?.humanDate ?? DateTime.now().humanDate` renders "Mar 14, 2026" in the top-right corner. This tells the user the date they already know. The master prompt specifies "Good morning, Alice" as the page title with the date as the eyebrow. The date chip adds no value the user doesn\'t already have — this is visual clutter violating Simplicity (every element must earn its place). Replace with a "Data is live" indicator or remove.',
    books:['Refactoring UI','Apple HIG Deference','Practical UI'],
    bad:'// Top-right date chip — redundant with system clock\nContainer(\n  child: Text(lastUpdated?.humanDate ?? DateTime.now().humanDate)',
    fix:'// Replace with compliance status indicator\nif (_compliance.overdueCount == 0)\n  ComplianceStatusPill(\n    label: "Fully compliant",\n    color: AppColors.success,\n  )\n// Or remove entirely — the user knows the date\n// Every element must earn its place (Simplicity principle)'
  },
  {
    id:'F-014', sev:'moderate', cat:'UX',
    title:'`_toDoOverdueCount` computes per-render — expensive O(n) in build method',
    desc:'`int get _toDoOverdueCount` iterates through `_toDo` and calls `_getAssignment(e)` for each enrollment, which in turn iterates `_assignments`. This is O(n×m) complexity running every rebuild. In Flutter, build() is called every frame on state changes. With 50 assignments × 20 todos = 1000 iterations per build. On older devices this causes jank. The count should be pre-computed and cached.',
    books:['Practical UI','Performance'],
    bad:'int get _toDoOverdueCount {\n  final now = DateTime.now();\n  return _toDo.where((e) {\n    final assignment = _getAssignment(e); // O(m) per call\n    return assignment != null && assignment.dueDate.isBefore(now);\n  }).length;\n}',
    fix:'// Pre-compute once in the build method, not in getter\nfinal overdueCount = useMemoized(\n  () => _toDo.where(_isOverdue).length,\n  [_toDo, _assignments],\n);\n// Or as a Riverpod selector:\nfinal overdueCountProvider = Provider((ref) {\n  final todos = ref.watch(todoEnrollmentsProvider);\n  return todos.where((e) => e.isOverdue).length;\n});'
  },
  {
    id:'F-015', sev:'moderate', cat:'Accessibility',
    title:'Tab count badges use `color: AppColors.n0` (white) on coloured background — may fail contrast',
    desc:'`Text("$count", style: AppTypography.caption.copyWith(color: badgeColor != null ? AppColors.n0 : AppColors.n600))` — AppColors.n0 is white text on `badgeColor`. If badgeColor is AppColors.warning (#D97706 — amber), the contrast ratio of white (#FFF) on #D97706 is approximately 2.4:1 — well below WCAG AA minimum of 4.5:1 for small text. This is a hard accessibility failure.',
    books:['WCAG AA','UI is Communication'],
    bad:"Text('$count',\n  style: AppTypography.caption.copyWith(\n    color: badgeColor != null ? AppColors.n0 : AppColors.n600,\n    // White on amber = 2.4:1 contrast — WCAG FAIL",
    fix:'Use dark text on light backgrounds, light text on dark:\ncolor: badgeColor != null\n  ? _accessibleTextFor(badgeColor!)  \n  : AppColors.n600,\n\nColor _accessibleTextFor(Color bg) {\n  final luminance = bg.computeLuminance();\n  return luminance > 0.4 ? AppColors.n900 : AppColors.n0;\n}'
  },
  {
    id:'F-016', sev:'moderate', cat:'UX',
    title:'Hero card metadata chips all have the same icon style — no type differentiation',
    desc:'`_CourseMetaChip(icon: Icons.description_outlined, label: courseType)`, `_CourseMetaChip(icon: Icons.timer_outlined, label: "~$estimatedMinutes min")`, and resumeLabel chip all use the same chip visual design with different icons. But courseType = "Mixed" is a content type (structural), estimated time is a duration (temporal), and resumeLabel is progress position (contextual). These three semantically different data points need visual differentiation — not just different icons in identical chips.',
    books:['UI is Communication','Refactoring UI hierarchy'],
    bad:'// Three semantically different facts look identical\n_CourseMetaChip(icon: Icons.description_outlined, label: courseType),\n_CourseMetaChip(icon: Icons.timer_outlined, label: "~45 min"),\n_CourseMetaChip(icon: Icons.bookmark_outlined, label: resumeLabel),',
    fix:'// Differentiate by visual weight:\n// Content type: filled chip (it defines WHAT the course is)\nFilledChip(label: courseType, color: AppColors.blue),\n// Duration: ghost chip (contextual info)\nGhostChip(icon: Icons.timer_outlined, label: "~45 min"),\n// Resume position: accent chip (actionable context)\nAccentChip(icon: Icons.bookmark, label: resumeLabel, color: AppColors.teal),'
  },
  {
    id:'F-017', sev:'minor', cat:'UX',
    title:'`_sortByDue` creates a new List.from on every build — unnecessary allocation',
    desc:'`List<Enrollment>.from(list)` creates a new list copy every time `_buildTabbedCourseList` rebuilds, which happens on every Riverpod state change. With 3 calls (inProgress, toDo, completed), that\'s 3 list copies per rebuild. Minor performance issue but violates clean code principles. The sort should be memoized or done in the provider layer.',
    books:['Practical UI','Performance'],
    bad:'List<Enrollment> _sortByDue(List<Enrollment> list) {\n  final sorted = List<Enrollment>.from(list); // New list every time\n  sorted.sort(...);\n  return sorted;\n}',
    fix:'// Sort in provider using select() for targeted rebuilds:\nfinal sortedInProgressProvider = Provider((ref) {\n  final enrollments = ref.watch(enrollmentsProvider).valueOrNull ?? [];\n  return enrollments\n    .where((e) => e.status == "in_progress")\n    .sorted((a, b) => a.dueDate.compareTo(b.dueDate));\n});'
  },
  {
    id:'F-018', sev:'minor', cat:'UX',
    title:'`_CourseMetaChip` estimated minutes always shows hardcoded `estimatedMinutes = 45`',
    desc:'`final estimatedMinutes = 45; // Would come from course metadata` — this hardcoded value renders "~45 min" for every single course on the dashboard. In a pharma LMS where courses range from 30-minute EHS basics to 6-hour GVP modules, showing "~45 min" for all is misleading. Combined with the hardcoded 0.35 progress (F-002), the hero card shows fake data for both time and progress.',
    books:['UI is Communication','ALCOA+'],

    fix:'// Pull from actual course data:\nfinal estimatedMinutes = enrollment.courseVersion?.course?.estimatedMinutes\n  ?? enrollment.courseVersion?.totalDurationMinutes\n  ?? 0;\n\n// Then display:\nif (estimatedMinutes > 0)\n  _CourseMetaChip(\n    icon: Icons.timer_outlined,\n    label: estimatedMinutes >= 60\n      ? "~${(estimatedMinutes/60).ceil()}h"\n      : "~$estimatedMinutes min",\n  )'
  },
  {

    desc:'The `LayoutBuilder` cross-axis count calculation (`constraints.maxWidth > 900 ? 3 : constraints.maxWidth > 600 ? 2 : 1`) is inline and will need to be duplicated in every screen that has a course grid. Atomic Design requires this to be a shared utility. If breakpoints change, every screen needs updating independently.',
    books:['Atomic Design','Practical UI'],

];

let current = 'all';

function sev(s) {
  return {critical:'sev-critical',major:'sev-major',moderate:'sev-moderate',minor:'sev-minor'}[s]||'';
}

function render() {
  const list = document.getElementById('flaw-list');
  const filtered = current === 'all' ? FLAWS : FLAWS.filter(f =>
    f.sev === current || f.cat === current
  );
  list.innerHTML = filtered.map(f => `
    <div class="flaw-card" data-id="${f.id}" onclick="toggle('${f.id}')">
      <div class="flaw-header">
        <span class="flaw-id">${f.id}</span>
        <span class="flaw-sev ${sev(f.sev)}">${f.sev}</span>
        <span class="flaw-title">${f.title}</span>
        <span class="flaw-category">${f.cat}</span>
        <span class="flaw-chevron">▾</span>
      </div>
      <div class="flaw-body">
        <div class="flaw-section">
          <div class="flaw-section-label">What's wrong</div>
          <div class="flaw-desc">${f.desc}</div>
          <div>${f.books.map(b=>`<span class="book-tag">${b}</span>`).join('')}</div>
        </div>
        <div class="flaw-section">
          <div class="fix-row">
            <div class="fix-col">
              <div class="fix-col-label">Current code (broken)</div>
              <div class="code-block">${f.bad.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
            </div>
            <div class="fix-col">
              <div class="fix-col-label fix">Fix / redesign instruction</div>
              <div class="code-block fix">${f.fix.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
            </div>
          </div>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('cnt-crit').textContent = FLAWS.filter(f=>f.sev==='critical').length;
  document.getElementById('cnt-maj').textContent = FLAWS.filter(f=>f.sev==='major').length;
  document.getElementById('cnt-mod').textContent = FLAWS.filter(f=>f.sev==='moderate').length;
  document.getElementById('cnt-min').textContent = FLAWS.filter(f=>f.sev==='minor').length;
}

function toggle(id) {
  document.querySelectorAll('.flaw-card').forEach(c => {
    if (c.dataset.id === id) c.classList.toggle('open');
  });
}

function filter(val, btn) {
  current = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

render();
</script>
