services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pharma_lms
      POSTGRES_PASSWORD: "vtiA6Sewk4NgyriJtYgg0zEHR1EZvsAr"
    volumes:
      - pharma_lms_data:/var/lib/postgresql/data

  # PgBouncer — connection pooling in transaction mode.
  # Serverpod connects to PgBouncer (port 6432), PgBouncer multiplexes to PostgreSQL.
  # This allows 200+ Serverpod connections to share ~50 real PostgreSQL connections.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: "postgres://postgres:vtiA6Sewk4NgyriJtYgg0zEHR1EZvsAr@postgres:5432/pharma_lms"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 400
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      SERVER_RESET_QUERY: "DISCARD ALL"
      AUTH_TYPE: plain
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "8091:6379"
    command: redis-server --requirepass "O0m9SlB724P6jFwbfZS-t0A2WNEZCgIH" --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pharma_lms_test
      POSTGRES_PASSWORD: "KcDx4Mc-sEpQvYuHidXQA4nwGMGhTMda"
    volumes:
      - pharma_lms_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:7-alpine
    ports:
      - "9091:6379"
    command: redis-server --requirepass "c1G-6w5hSrRZL-H6QH5hFAkqIpmQrlfh"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  pharma_lms_data:
  pharma_lms_test_data:
