services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pharma_lms
      POSTGRES_PASSWORD: "vtiA6Sewk4NgyriJtYgg0zEHR1EZvsAr"
    volumes:
      - pharma_lms_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "O0m9SlB724P6jFwbfZS-t0A2WNEZCgIH"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pharma_lms_test
      POSTGRES_PASSWORD: "KcDx4Mc-sEpQvYuHidXQA4nwGMGhTMda"
    volumes:
      - pharma_lms_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "c1G-6w5hSrRZL-H6QH5hFAkqIpmQrlfh"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  pharma_lms_data:
  pharma_lms_test_data:
