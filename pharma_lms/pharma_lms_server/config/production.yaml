# This is the configuration file for your production environment.
# Deployed on Render.com with managed PostgreSQL.
# Environment variables override these defaults at runtime.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: ${RENDER_EXTERNAL_HOSTNAME:pharma-lms-api.onrender.com}
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server (internal only on Render).
insightsServer:
  port: 8081
  publicHost: ${RENDER_EXTERNAL_HOSTNAME:pharma-lms-api.onrender.com}
  publicPort: 443
  publicScheme: https

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: ${RENDER_EXTERNAL_HOSTNAME:pharma-lms-api.onrender.com}
  publicPort: 443
  publicScheme: https

# Database configuration - uses Render's managed PostgreSQL.
# All values can be overridden via environment variables:
# SERVERPOD_DATABASE_HOST, SERVERPOD_DATABASE_PORT, SERVERPOD_DATABASE_NAME,
# SERVERPOD_DATABASE_USER, SERVERPOD_DATABASE_PASSWORD
database:
  host: ${SERVERPOD_DATABASE_HOST}
  port: ${SERVERPOD_DATABASE_PORT:5432}
  name: ${SERVERPOD_DATABASE_NAME:pharma_lms}
  user: ${SERVERPOD_DATABASE_USER:postgres}
  requireSsl: true
  maxConnectionCount: 20

# Redis configuration - disabled for starter plan.
# Enable when scaling up.
redis:
  enabled: ${SERVERPOD_REDIS_ENABLED:false}
  host: ${SERVERPOD_REDIS_HOST:localhost}
  port: ${SERVERPOD_REDIS_PORT:6379}
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  consoleEnabled: false
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# S3/MinIO object storage for documents, materials, and uploads.
# Use MinIO for on-prem or dev; AWS S3 for production.
# See docs/STORAGE_S3.md for setup instructions.
#storage:
  #s3:
    #enabled: true
    # For AWS S3: use endpoint null and set region.
    # For MinIO: use endpoint (e.g. http://minio:9000) and region optional.
    #endpoint: https://s3.amazonaws.com
    #region: us-east-1
    #bucket: pharma-lms-storage
    # Access key and secret - set via environment or config override. Do not commit secrets.
    #accessKey: ""
    #secretKey: ""
    # Optional: use path-style for MinIO compatibility
    # pathStyle: true
    # Optional: custom domain for presigned URLs
    # publicUrl: https://cdn.example.com
storage:
  s3:
    enabled: true
    endpoint: http://minio:9000   # or http://localhost:9000 if running locally
    region: us-east-1
    bucket: pharma-lms-storage
    accessKey: minioadmin
    secretKey: minioadmin
    pathStyle: true   # Required for MinIO