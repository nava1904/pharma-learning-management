### Message between a learner and the course trainer for a given course version.
class: LearnerTrainerMessage

table: learner_trainer_message

fields:
  courseVersion: CourseVersion?, relation
  fromUser: PharmaUser?, relation
  toUser: PharmaUser?, relation
  body: String
  parentMessage: LearnerTrainerMessage?, relation(optional)
  readAt: DateTime?
  createdAt: DateTime, default=now

indexes:
  learner_trainer_cv_idx:
    fields: courseVersionId, createdAt
  learner_trainer_from_idx:
    fields: fromUserId, createdAt
  learner_trainer_to_idx:
    fields: toUserId, readAt
  learner_trainer_to_created_idx:
    fields: toUserId, createdAt
