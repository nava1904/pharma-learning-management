### Enrollment - user's progress in a course version.
class: Enrollment

table: enrollment

fields:
  ### The user.
  user: PharmaUser?, relation
  ### The course version.
  courseVersion: CourseVersion?, relation
  ### The assignment that created this enrollment.
  assignment: TrainingAssignment?, relation(optional)
  ### Status: not_started, in_progress, completed, overdue.
  status: String, default='not_started'
  ### When started.
  startedAt: DateTime?
  ### When completed.
  completedAt: DateTime?
  ### For retraining: change summary from document/course version (EMP-10).
  retrainingChangeSummary: String?
  ### When user acknowledged retraining change summary.
  acknowledgedAt: DateTime?
  ### E-signature for retraining acknowledgement.
  acknowledgementEsignature: ElectronicSignature?, relation(optional)
