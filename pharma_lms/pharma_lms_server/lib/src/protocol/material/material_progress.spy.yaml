### User progress on material (video watch, scroll depth).
class: MaterialProgress

table: material_progress

fields:
  ### The user.
  user: PharmaUser?, relation
  ### The material.
  material: Material?, relation
  ### Progress percentage 0-100.
  progressPct: int, default=0
  ### When completed (null if in progress).
  completedAt: DateTime?
  ### Interaction data as JSON (watch/pause, scroll depth).
  interactionJson: String?
  ### Material version for retraining tracking.
  materialVersionId: int?
  ### Enrollment this progress belongs to.
  enrollmentId: int?
  ### Active engagement time in seconds.
  timeSpentSeconds: int?
  ### When the server last received a heartbeat (for server-side minimum read time).
  lastHeartbeat: DateTime?
  ### Whether minimum read time was met (server-set only).
  readTimeMet: bool?
