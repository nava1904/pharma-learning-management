### Versioned material for document control.
class: MaterialVersion

table: material_version

fields:
  ### The material.
  material: Material?, relation
  ### Version number.
  version: int
  ### Storage key for this version.
  storageKey: String
  ### When created.
  createdAt: DateTime, default=now
  ### SHA-256 file hash for integrity verification (TRN-WF-02).
  fileHash: String?
  ### Virus scan status: pending, clean, quarantined (TRN-WF-02).
  virusScanStatus: String?, default='pending'
  ### When virus scan completed.
  virusScanAt: DateTime?
  ### File size in bytes.
  fileSizeBytes: int?
