### Assessment linked to course version.
class: Assessment

table: assessment

fields:
  ### The course version.
  courseVersion: CourseVersion?, relation
  ### The question bank.
  questionBank: QuestionBank?, relation
  ### Passing score percentage (e.g., 80).
  passingScore: int
  ### Whether to randomize questions.
  randomize: bool, default=true
  ### Time limit in minutes.
  timeLimitMinutes: int?
  ### Maximum attempts allowed (0 = unlimited).
  maxAttempts: int?
  ### Number of questions to display from the bank.
  ### TRN-WF-03: Must be <= totalQuestions / 2 for adequate randomization.
  questionsToDisplay: int?
  ### Whether to show correct answers after submission.
  showAnswers: bool, default=false
  ### Whether to show previous submission history to the learner.
  showSubmissionHistory: bool, default=false
  ### Limit the number of questions shown (used with randomize).
  limitQuestions: int?
