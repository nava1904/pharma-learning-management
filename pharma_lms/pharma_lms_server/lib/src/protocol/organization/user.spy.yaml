### Pharma LMS user - links identity to organization hierarchy.
class: PharmaUser

table: pharma_user

fields:
  ### Primary identifier for login and notifications.
  email: String
  ### First name.
  firstName: String
  ### Last name.
  lastName: String
  ### The department this user belongs to.
  department: Department?, relation
  ### The job role for training matrix.
  jobRole: JobRole?, relation
  ### The site this user is assigned to.
  site: Site?, relation
  ### The organization this user belongs to.
  organization: Organization?, relation
  ### User status (active, inactive, suspended).
  status: String, default='active'
  ### When the user was created.
  createdAt: DateTime, default=now
  ### Optional link to serverpod auth user ID.
  authUserId: int?
  ### HR system employee ID.
  employeeId: String?
  ### Hire date.
  hireDate: DateTime?
  ### Manager user ID.
  managerId: int?
  ### Preferred language code.
  preferredLanguage: String?
  ### User timezone (e.g., America/New_York).
  timezone: String?, default='UTC'
  ### Last login timestamp.
  lastLogin: DateTime?
  ### Authentication type (e.g., SSO, Local).
  authType: String?
  ### Whether MFA is enabled for this user.
  mfaEnabled: bool?, default=false
  ### Compliance percent (0-100).
  compliancePercent: double?, default=0.0
  ### List of roles assigned to the user.
  roles: List<String>?
  ### Site-specific JSON attributes (Vault-style extension without codegen churn).
  customMetadataJson: String?
  ### Opaque WebAuthn / biometric credential id for step-up auth (roadmap).
  biometricCredentialId: String?
