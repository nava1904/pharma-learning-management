# Full stack: PostgreSQL, Redis, Kafka for Pharma LMS
# Usage: docker compose -f docker/docker-compose.full.yaml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pharma_lms
      POSTGRES_PASSWORD: "vtiA6Sewk4NgyriJtYgg0zEHR1EZvsAr"
    volumes:
      - pharma_lms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer — connection pooler in transaction mode.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: "postgres://postgres:vtiA6Sewk4NgyriJtYgg0zEHR1EZvsAr@postgres:5432/pharma_lms"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 400
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      SERVER_RESET_QUERY: "DISCARD ALL"
      AUTH_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "8091:6379"
    command: redis-server --requirepass "O0m9SlB724P6jFwbfZS-t0A2WNEZCgIH" --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "O0m9SlB724P6jFwbfZS-t0A2WNEZCgIH", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pharma_lms_data:
