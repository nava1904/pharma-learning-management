services:
  # Serverpod Backend API
  - type: web
    name: pharma-lms-api
    runtime: docker
    dockerfilePath: ./pharma_lms/pharma_lms_server/Dockerfile.render
    dockerContext: ./pharma_lms
    region: oregon
    plan: starter
    branch: main
    healthCheckPath: /
    envVars:
      - key: SERVERPOD_DATABASE_HOST
        fromDatabase:
          name: pharma-lms-db
          property: host
      - key: SERVERPOD_DATABASE_PORT
        fromDatabase:
          name: pharma-lms-db
          property: port
      - key: SERVERPOD_DATABASE_NAME
        fromDatabase:
          name: pharma-lms-db
          property: database
      - key: SERVERPOD_DATABASE_USER
        fromDatabase:
          name: pharma-lms-db
          property: user
      - key: SERVERPOD_DATABASE_PASSWORD
        fromDatabase:
          name: pharma-lms-db
          property: password
      - key: SERVERPOD_REDIS_ENABLED
        value: "true"
      - key: SERVERPOD_REDIS_HOST
        fromService:
          name: pharma-lms-redis
          type: redis
          property: host
      - key: SERVERPOD_REDIS_PORT
        fromService:
          name: pharma-lms-redis
          type: redis
          property: port
      - key: SERVERPOD_REDIS_PASSWORD
        fromService:
          name: pharma-lms-redis
          type: redis
          property: password
      - key: SERVERPOD_API_SERVER_PORT
        value: "8080"
      - key: SERVERPOD_RUN_MODE
        value: "production"
      - key: SERVERPOD_SERVICE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pharma-lms-web.onrender.com,https://pharma-lms.vercel.app"

  # Flutter Web Frontend (Docker-based)
  - type: web
    name: pharma-lms-web
    runtime: docker
    dockerfilePath: ./pharma_lms/pharma_lms_flutter/Dockerfile.render
    dockerContext: ./pharma_lms
    region: oregon
    plan: starter
    branch: main
    healthCheckPath: /

databases:
  - name: pharma-lms-db
    databaseName: pharma_lms
    region: oregon
    plan: starter
    postgresMajorVersion: "15"

# Redis for session sharing, WebSocket pub/sub, cache, and future call coordination.
# Render does not natively support Redis in render.yaml — use the Render dashboard
# to create a managed Redis instance, or use Upstash/Redis Cloud.
# Then set these env vars on the pharma-lms-api service:
#   SERVERPOD_REDIS_HOST, SERVERPOD_REDIS_PORT, SERVERPOD_REDIS_PASSWORD
