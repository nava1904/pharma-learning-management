name: Deploy Serverpod Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'pharma_lms/pharma_lms_server/**'
      - 'pharma_lms/pharma_lms_client/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pharma_lms/pharma_lms_server/**'
      - 'pharma_lms/pharma_lms_client/**'
  workflow_dispatch:

env:
  DART_SDK_VERSION: '3.5.0'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli

      - name: Get dependencies (client)
        working-directory: pharma_lms/pharma_lms_client
        run: dart pub get

      - name: Get dependencies (server)
        working-directory: pharma_lms/pharma_lms_server
        run: dart pub get

      - name: Analyze code
        working-directory: pharma_lms/pharma_lms_server
        run: dart analyze --fatal-infos

      - name: Run tests
        working-directory: pharma_lms/pharma_lms_server
        run: dart test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pharma_lms_test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Get dependencies
        working-directory: pharma_lms/pharma_lms_server
        run: dart pub get

      - name: Compile server
        working-directory: pharma_lms/pharma_lms_server
        run: dart compile exe bin/main.dart -o bin/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: pharma_lms/pharma_lms_server/bin/server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"
